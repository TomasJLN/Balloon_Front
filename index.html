<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="%VITE_BACKEND_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_BACKEND_URL%" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Proyecto Experiencias Diferentes - JSB05RT" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
    <title>Balloon App</title>
    <style>
      /* Footer layout reservado para evitar CLS cuando el CSS bundle carga diferido */
      .footer { display: block; width: 100%; }
      .footer .links { width: 100%; display: flex; align-items: center; justify-content: center; padding: 1.25rem 1rem; }
    </style>
    <script>
      (function () {
        try {
          var base = '%VITE_BACKEND_URL%';
          fetch(base + '/allFilter?experience=&active=1&featured=1')
            .then(function (r) { return r.json(); })
            .then(function (json) {
              var list = json && json.data;
              if (!Array.isArray(list) || !list.length) return;
              var photo = list[0].photo;
              if (!photo || photo === 'NA.png') return;
              var p = encodeURIComponent(photo);
              var link = document.createElement('link');
              link.rel = 'preload';
              link.as = 'image';
              link.href = base + '/uploads/thumbs/' + p;
              link.setAttribute('imagesrcset',
                base + '/uploads/thumbs/sm/' + p + ' 340w, ' +
                base + '/uploads/thumbs/' + p + ' 420w'
              );
              link.setAttribute('imagesizes', '(max-width: 767px) 340px, 420px');
              link.setAttribute('fetchpriority', 'high');
              document.head.appendChild(link);
            })
            .catch(function () {});
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
